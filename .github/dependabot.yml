# Dependabot keeps the pinned action SHAs and npm dependencies current. Titles
# carry a Conventional Commits prefix so they pass the "PR title" check, and
# updates are grouped so one pull request a week is the usual case.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # The Node types follow the runtime in package.json "engines", not the newest release.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # A new TypeScript major is a compiler change every package must adopt together, by hand.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore(site)
    groups:
      site-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
