# Dependabot keeps the pinned action SHAs and npm dependencies current. Titles
# carry a Conventional Commits prefix so they pass the "PR title" check; the
# actions are grouped (short title), npm updates are one PR each (see below).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    # Not grouped: a grouped title reads "bump <pkg> ... in the <group> group across 1
    # directory", which runs past the 72-character PR title limit; one PR per dependency
    # keeps "chore(deps): bump <pkg> from a to b", which fits.
    ignore:
      # The Node types follow the runtime in package.json "engines", not the newest release.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # A new TypeScript major is a compiler change every package must adopt together, by hand.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore(site)
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
