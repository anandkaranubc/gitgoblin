# Builds the website in site/ and deploys it to GitHub Pages.
# One-time setup: Settings > Pages > Source: GitHub Actions.
name: Website

on:
  push:
    branches: [main]
    paths: ["site/**", "brand/**", ".github/workflows/site.yml"]
  pull_request:
    paths: ["site/**", "brand/**", ".github/workflows/site.yml"]
  workflow_dispatch:

# Each job gets only what it needs. The build runs npm ci and Astro over a few hundred packages, so it
# holds no OIDC token and cannot write to Pages; only the deploy job, which runs GitHub's own action
# and no third-party code, can.
permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read # configure-pages reads the site's address
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        # Gives the site its public origin and base path, so the same build
        # works at <owner>.github.io/<repo> and behind a custom domain.
      - run: npm ci
      - run: npm run check
      - run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - run: npm test
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
