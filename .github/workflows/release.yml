# Builds a release from a tag, attests what it built, drafts the GitHub release and publishes to npm.
#
# A tag starts it: v<version> releases the gitgoblin CLI (packages/cli), mcp-v<version> the MCP server
# (packages/mcp). The tag must be on main and match the package's version, and CHANGELOG.md must have
# a dated section for it. Nothing becomes public without a person: the GitHub release is a draft for
# the maintainer to read and publish, and the npm job waits for approval in the `npm` environment.
# docs/releasing.md is the whole procedure.
#
# Run it by hand (Actions > Release > Run workflow) to rehearse a release from any branch: every check,
# the pack and the install smoke test run, and nothing is attested, drafted or published.
#
# Only the attest job holds an OIDC token, and it runs no third-party code. The build job, which runs
# npm ci, the tests and the bundlers, can read the repository and nothing else.
name: Release

on:
  push:
    tags: ["v[0-9]*", "mcp-v[0-9]*"]
  workflow_dispatch:
    inputs:
      package:
        description: Package to rehearse
        type: choice
        options: [gitgoblin, "@gitgoblin/mcp"]
        default: gitgoblin

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      name: ${{ steps.which.outputs.name }}
      version: ${{ steps.which.outputs.version }}
      tarball: ${{ steps.pack.outputs.tarball }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # to check that the tag is on main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # No dependency cache: a release is built from the lockfile and the registry alone.
          package-manager-cache: false

      - name: Work out the package and version
        id: which
        env:
          # Through the environment, so a crafted tag or input cannot run as shell code.
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
          CHOSEN: ${{ inputs.package }}
        run: |
          if [ "$EVENT" = push ]; then
            case "$TAG" in
              v*) name=gitgoblin; wanted=${TAG#v} ;;
              mcp-v*) name=@gitgoblin/mcp; wanted=${TAG#mcp-v} ;;
            esac
            # A release is cut from reviewed code only.
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::tag $TAG points at $GITHUB_SHA, which is not on main"; exit 1
            fi
          else
            name=$CHOSEN
          fi
          case "$name" in
            gitgoblin) dir=packages/cli ;;
            @gitgoblin/mcp) dir=packages/mcp ;;
            *) echo "::error::no package for tag '$TAG'"; exit 1 ;;
          esac
          version=$(jq -r .version "$dir/package.json")
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::$dir/package.json has an unexpected version: $version"; exit 1
          fi
          if [ "$EVENT" = push ] && [ "$wanted" != "$version" ]; then
            echo "::error::tag $TAG is for $wanted, but $dir/package.json says $version"; exit 1
          fi
          { echo "name=$name"; echo "version=$version"; } >> "$GITHUB_OUTPUT"

      - name: Take the release notes from CHANGELOG.md
        env:
          EVENT: ${{ github.event_name }}
          NAME: ${{ steps.which.outputs.name }}
          VERSION: ${{ steps.which.outputs.version }}
        run: |
          heading="## $NAME $VERSION"
          awk -v h="$heading" '$0 == h || index($0, h " ") == 1 { on = 1; print; next } on && /^## / { exit } on { print }' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section that starts with '$heading'"; exit 1
          fi
          if [ "$EVENT" = push ] && ! head -n 1 notes.md | grep -Eq ' - [0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
            echo "::error::give the CHANGELOG.md heading for $NAME $VERSION its release date: '$heading - YYYY-MM-DD'"; exit 1
          fi
          # The heading becomes the release title; the rest is the body.
          tail -n +2 notes.md > release-notes.md
          cat release-notes.md

      - run: npm ci
      # As in CI: without bwrap the engine's Linux sandbox tests skip, so a release could ship a sandbox
      # those tests would have caught. The last line fails the job if bwrap still cannot sandbox.
      - name: Install bubblewrap for the engine's sandbox tests
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --unshare-all --die-with-parent --ro-bind / / true
      - run: npm run typecheck
      - run: npm test
      - run: npm run docs:check
      - name: No high-severity advisories in runtime dependencies
        # Runtime dependencies of the workspace packages end up inside the published bundles. Build-only
        # tools are left out on purpose; docs/releasing.md lists their known advisories.
        run: npm audit --omit=dev --audit-level=high

      - name: Pack
        id: pack
        env:
          NAME: ${{ steps.which.outputs.name }}
        run: |
          mkdir out
          npm pack -w "$NAME" --pack-destination out
          tarball=$(cd out && ls -- *.tgz)
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      - name: Build the MCPB bundle
        if: steps.which.outputs.name == '@gitgoblin/mcp'
        run: |
          npm run mcpb -w @gitgoblin/mcp
          cp packages/mcp/dist/gitgoblin.mcpb out/

      - name: Install the tarball and run it
        env:
          NAME: ${{ steps.which.outputs.name }}
          VERSION: ${{ steps.which.outputs.version }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          # An empty prefix outside the checkout, so nothing resolves from the workspace. The ./ matters:
          # without it npm reads out/<file>.tgz as a GitHub repository named <file>.tgz owned by "out".
          prefix="$RUNNER_TEMP/smoke"
          npm install --global --prefix "$prefix" --no-audit --no-fund "./out/$TARBALL"
          case "$NAME" in
            gitgoblin)
              got=$("$prefix/bin/gitgoblin" --version)
              [ "$got" = "$VERSION" ] || { echo "::error::installed gitgoblin says $got, expected $VERSION"; exit 1; }
              "$prefix/bin/gitgoblin" goals > /dev/null
              echo "installed gitgoblin $got" ;;
            @gitgoblin/mcp)
              node scripts/smoke-mcp.mjs "$prefix/bin/gitgoblin-mcp" "$VERSION" ;;
          esac

      - name: Checksums
        run: |
          cd out
          # Hash first, then write, so SHA256SUMS never lists itself.
          sums=$(sha256sum -- *)
          printf '%s\n' "$sums" | tee SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            out/
            release-notes.md
          if-no-files-found: error

  attest:
    name: Attest build provenance
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # signs the attestation; nothing else runs in this job
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
      - name: Check the files against SHA256SUMS
        run: cd out && sha256sum -c SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/*

  draft:
    name: Draft the GitHub release
    needs: [build, attest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
      - name: Create the draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          NAME: ${{ needs.build.outputs.name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" ./out/* --draft --verify-tag $prerelease \
            --title "$NAME $VERSION" --notes-file release-notes.md

  npm:
    name: Publish to npm
    # Off until the maintainer has set up the `npm` environment with required reviewers and then set
    # the repository variable NPM_PUBLISH to true: GitHub creates a missing environment with no rules,
    # which would let this job run unapproved.
    if: vars.NPM_PUBLISH == 'true'
    needs: [build, draft]
    runs-on: ubuntu-latest
    # The maintainer approves this job, after reading the draft release.
    environment: npm
    permissions:
      contents: read
      id-token: write # npm trusted publishing, which also signs provenance
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
      - name: Publish the tarball that was built, checked and attested
        env:
          VERSION: ${{ needs.build.outputs.version }}
          TARBALL: ${{ needs.build.outputs.tarball }}
          # Empty once trusted publishing is set up on npmjs.com; only the very first publish of a
          # package needs a token (docs/releasing.md).
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          (cd out && sha256sum -c SHA256SUMS)
          tag=latest
          case "$VERSION" in *-*) tag=next ;; esac
          # The ./ keeps npm from reading the path as a GitHub repository (see the smoke test above).
          npm publish "./out/$TARBALL" --access public --provenance --tag "$tag"
